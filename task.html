<!DOCTYPE html>
<html>
<head>
    <title>Healthcare Support Portal</title>
    <link rel="stylesheet" href="task.css">
</head>
<body>

    <div class="container">

        <h1>Healthcare Support Portal</h1>

        <p>
            Please fill out the form below and our healthcare support
            team will review your information.
        </p>

        <form id="healthForm">

            <label>Patient Name</label>
            <input type="text" id="name" required>

            <label>Age</label>
            <input type="number" id="age" required>

            <label>Phone Number</label>
            <input type="tel" id="phone" required>

            <label>Email Address</label>
            <input type="email" id="email" required>

            <label>City</label>
            <input type="text" id="city" required>

            <label>Have you already booked an appointment?</label>
            <select id="appointmentStatus" onchange="toggleAppointmentFields()" required>
                <option value="">Select</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <div id="appointmentDetails" style="display:none;">

                <label>Appointment Date</label>
                <input type="date" id="appointmentDate">

                <label>Appointment Time</label>
                <input type="time" id="appointmentTime">

            </div>

            <label>Reason for Seeking Support</label>
            <textarea
                id="concern"
                rows="5"
                placeholder="Describe your health concern or reason for seeking support"
                required>
            </textarea>

            <button type="button" onclick="generateSummary()">
                Generate AI Summary
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="task.js"></script>

</body>
</html>
